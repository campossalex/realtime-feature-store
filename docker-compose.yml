name: betting-features-oss

# Open-source Flink + Fluss betting feature store demo.
# Replaces the VVP-based create_vvp_drafts.sh with flink run / SQL Client.
#
# Prerequisites:
#   1. Run ./download-jars.sh once to populate ./lib/ with connector JARs.
#   2. docker compose up -d
#   3. Follow start.sh or README for SQL setup and job submission.
#
# Fluss is the online feature store, and it also holds the raw events: an ingest job copies
# the four Kafka topics into Fluss log tables, which the Fluss tiering service tiers to
# Iceberg (Lakekeeper REST catalog, MinIO storage) for point-in-time history. The tiering
# setup follows github.com/campossalex/streamhouse.
#
# Ports exposed to the host:
#   8081  — Flink Web UI
#   9123  — Fluss coordinator (bootstrap for flink / pyfluss clients)
#   9092  — Redpanda Kafka (internal Docker), 19092 from the host
#   5432  — PostgreSQL
#   9051  — Inference service REST API
#   3000  — Grafana
#   8082  — Redpanda Console
#   80    — Environment homepage (start here; links to everything)
#   8083  — Flink SQL Gateway (REST)
#   8084  — Web SQL editor (in front of the SQL Gateway); Pipeline Builder at /pipeline
#   8181  — Lakekeeper (Iceberg REST catalog + its web UI at /ui)
#   9000  — MinIO S3 API, 9001 — MinIO console (admin / password)

x-flink-image: &flink-image apache/flink:1.20-java17
x-fluss-image: &fluss-image apache/fluss:0.9.1-incubating

# Mounted at the same path everywhere Fluss data is read or written — see remote.data.dir
# in the Fluss server properties below for why this is a shared volume and not s3://.
#
# Deliberately NOT under /tmp/fluss. Docker creates a mount point's missing parents as
# root:root 0755, and /tmp/fluss is the Fluss client's default scratch directory: a
# streaming read of a PK table downloads its KV snapshot there, so in the Flink
# containers every such read would fail with
#   IOException: Failed to create directory /tmp/fluss/kv-snapshots-... for storing kv snapshot files
x-fluss-remote: &fluss-remote fluss-remote-data:/fluss/remote-data

# S3 keys for MinIO, for the Iceberg reader inside Flink (the union read, the $lake
# tables, the `iceberg` catalog). Fluss hands clients the table's datalake options but
# drops the credential ones, so without these the AWS SDK's default provider chain comes
# up empty and every lake read fails with
#   SdkClientException: Unable to load credentials from any of the providers in the chain
x-aws-env: &aws-env
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: password
  AWS_REGION: us-east-1

# The Fluss server configuration, shared by the coordinator and the tablet server.
# Passed as FLUSS_PROPERTIES, which the image's entrypoint appends to conf/server.yaml —
# rather than bind-mounting server.yaml, which the entrypoint edits in place with sed -i.
x-fluss-properties: &fluss-properties |
  zookeeper.address: zookeeper:2181
  default.replication.factor: 1

  # Remote data directory — Fluss offloads cold log segments and KV snapshots here.
  #
  # Deliberately a shared local volume, NOT s3://. When remote.data.dir is on S3, Fluss
  # hands clients short-lived STS credentials (GetSessionToken), which MinIO does not
  # implement, so every Flink read that touches remote data fails with
  #   NoAwsCredentialsException: Dynamic session credentials for Fluss: No AWS Credentials
  # The Iceberg lake below still lives on MinIO — Iceberg's S3FileIO takes static keys.
  remote.data.dir: /fluss/remote-data

# Datalake tiering to Iceberg, through the Lakekeeper REST catalog. Complete mode only:
# the Fluss servers append these when LAKEHOUSE=1 (start.sh writes it to .env). In simple
# mode Lakekeeper and MinIO do not run, and a server pointed at them would fail every
# CREATE TABLE.
x-fluss-lake-properties: &fluss-lake-properties |
  # datalake.format is copied into each log table's properties at CREATE TABLE time
  # (03_ingest_to_fluss.sql).
  #
  # The same datalake.iceberg.* values are passed to the tiering job from
  # scripts/tiering.args, and reach the Flink union read through the table properties.
  # Keep all three in sync.
  datalake.format: iceberg
  datalake.iceberg.type: rest
  datalake.iceberg.uri: http://lakekeeper:8181/catalog
  datalake.iceberg.warehouse: lakehouse
  datalake.iceberg.io-impl: org.apache.iceberg.aws.s3.S3FileIO
  datalake.iceberg.s3.endpoint: http://minio:9000
  datalake.iceberg.s3.access-key-id: admin
  datalake.iceberg.s3.secret-access-key: password
  datalake.iceberg.s3.path-style-access: true
  datalake.iceberg.client.region: us-east-1

services:

  # ── Fluss coordination (ZooKeeper) ──────────────────────────────────────────

  zookeeper:
    image: zookeeper:3.9.1
    hostname: zookeeper
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: "server.1=zookeeper:2888:3888;2181"
    networks:
      - flink-net
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Fluss coordinator server ─────────────────────────────────────────────────
  # The image ships fluss-lake-iceberg in plugins/iceberg/, but that JAR bundles Iceberg
  # core without S3FileIO. The entrypoint drops iceberg-aws, its AWS SDK bundle and
  # failsafe alongside it, so the coordinator can create the Iceberg table on MinIO for
  # every table created with 'table.datalake.enabled' = 'true'.

  coordinator-server:
    image: *fluss-image
    hostname: coordinator-server
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [ "$$LAKEHOUSE" = 1 ]; then
          cp /opt/lib/iceberg-aws-*.jar /opt/lib/failsafe-*.jar /opt/fluss/plugins/iceberg/
          FLUSS_COMMON_PROPERTIES="$$FLUSS_COMMON_PROPERTIES
        $$FLUSS_LAKE_PROPERTIES"
        fi
        export FLUSS_PROPERTIES="$$FLUSS_ROLE_PROPERTIES
        $$FLUSS_COMMON_PROPERTIES"
        exec /docker-entrypoint.sh coordinatorServer
    environment:
      TZ: UTC
      FLUSS_COMMON_PROPERTIES: *fluss-properties
      FLUSS_LAKE_PROPERTIES: *fluss-lake-properties
      LAKEHOUSE: ${LAKEHOUSE:-0}
      FLUSS_ROLE_PROPERTIES: |
        bind.listeners: FLUSS://coordinator-server:9123
    depends_on:
      zookeeper:
        condition: service_healthy
      # Complete mode only (the lakehouse profile); in simple mode it is not started.
      lakekeeper-warehouse:
        condition: service_completed_successfully
        required: false
      fluss-remote-init:
        condition: service_completed_successfully
    volumes:
      - ./lib:/opt/lib:ro
      - *fluss-remote
    ports:
      - "9123:9123"
    networks:
      - flink-net
    healthcheck:
      # Real TCP check. The previous version ended in `|| true; exit 0`, so it always
      # reported healthy and depends_on: service_healthy gave no ordering guarantee.
      # Note: the server binds its advertised hostname, not localhost.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/coordinator-server/9123"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # ── Fluss tablet server ──────────────────────────────────────────────────────

  tablet-server:
    image: *fluss-image
    hostname: tablet-server
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [ "$$LAKEHOUSE" = 1 ]; then
          cp /opt/lib/iceberg-aws-*.jar /opt/lib/failsafe-*.jar /opt/fluss/plugins/iceberg/
          FLUSS_COMMON_PROPERTIES="$$FLUSS_COMMON_PROPERTIES
        $$FLUSS_LAKE_PROPERTIES"
        fi
        export FLUSS_PROPERTIES="$$FLUSS_ROLE_PROPERTIES
        $$FLUSS_COMMON_PROPERTIES"
        exec /docker-entrypoint.sh tabletServer
    environment:
      TZ: UTC
      FLUSS_COMMON_PROPERTIES: *fluss-properties
      FLUSS_LAKE_PROPERTIES: *fluss-lake-properties
      LAKEHOUSE: ${LAKEHOUSE:-0}
      FLUSS_ROLE_PROPERTIES: |
        bind.listeners: FLUSS://tablet-server:9123
        tablet-server.id: 1
        data.dir: /tmp/fluss/data
    depends_on:
      coordinator-server:
        condition: service_healthy
    volumes:
      - ./lib:/opt/lib:ro
      - *fluss-remote
    networks:
      - flink-net

  # The volume is shared by the root-run Fluss servers and the Flink containers, and both
  # sides write to it: the servers their log segments and KV snapshots, the tiering job
  # its per-commit offsets files (lake/<db>/<table>/metadata/*.offsets). A fresh named
  # volume is root:root 0755, so without this the tiering job's first commit would fail
  # on a permission error.
  fluss-remote-init:
    image: *fluss-image
    user: root
    entrypoint: ["/bin/sh", "-c", "chmod 1777 /fluss/remote-data && echo 'fluss remote dir ready.'"]
    volumes:
      - *fluss-remote
    networks:
      - flink-net

  # ── Object storage + the Iceberg REST catalog ────────────────────────────────
  # The `pgsty/minio` community fork (upstream MinIO no longer publishes pullable images),
  # and Lakekeeper with its metadata in its own PostgreSQL. Same setup as streamhouse.
  # All in the `lakehouse` profile: started in complete mode only (COMPOSE_PROFILES in .env).

  minio:
    profiles: [lakehouse]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      TZ: UTC
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - flink-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    profiles: [lakehouse]
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - >
        mc alias set local http://minio:9000 admin password &&
        mc mb --ignore-existing local/warehouse &&
        echo 'Bucket s3://warehouse ready.'
    networks:
      - flink-net

  catalog-db:
    profiles: [lakehouse]
    image: postgres:17
    hostname: catalog-db
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
      TZ: UTC
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks:
      - flink-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Schema migrations run as their own one-shot container: `serve` does not migrate.
  lakekeeper-migrate:
    profiles: [lakehouse]
    image: quay.io/lakekeeper/catalog:v0.13.5
    restart: "no"
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: workshop-key-not-secure
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@catalog-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@catalog-db:5432/lakekeeper
      RUST_LOG: info
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - flink-net

  lakekeeper:
    profiles: [lakehouse]
    image: quay.io/lakekeeper/catalog:v0.13.5
    hostname: lakekeeper
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "8181:8181"
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    networks:
      - flink-net
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # A fresh Lakekeeper refuses every API call until someone accepts the terms of use,
  # and has no warehouse until one is created. A second run gets a 4xx for each, which
  # is harmless: curl exits 0 without -f, so the dependency chain still completes.
  lakekeeper-bootstrap:
    profiles: [lakehouse]
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      lakekeeper:
        condition: service_healthy
    command:
      - -sS
      - -X
      - POST
      - http://lakekeeper:8181/management/v1/bootstrap
      - -H
      - "Content-Type: application/json"
      - --data
      - '{"accept-terms-of-use": true}'
    networks:
      - flink-net

  # The `lakehouse` warehouse: the mapping from catalog to s3://warehouse on MinIO.
  # sts-enabled and remote-signing-enabled are both false on purpose. Remote signing
  # makes Iceberg's S3FileIO instantiate S3V4RestSignerClient, which fails inside
  # fluss-lake-iceberg (its shaded Jackson does not match iceberg-aws's) with a
  # VerifyError at the first tiering commit.
  lakekeeper-warehouse:
    profiles: [lakehouse]
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      lakekeeper-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./lakekeeper/create-warehouse.json:/tmp/create-warehouse.json:ro
    command:
      - -sS
      - -X
      - POST
      - http://lakekeeper:8181/management/v1/warehouse
      - -H
      - "Content-Type: application/json"
      - --data
      - "@/tmp/create-warehouse.json"
    networks:
      - flink-net

  # ── Flink session cluster ────────────────────────────────────────────────────
  # lib/ is mounted from the host — run ./download-jars.sh first.

  jobmanager:
    image: *flink-image
    hostname: jobmanager
    entrypoint: /bin/sh
    command:
      - -c
      # This shell runs as root; docker-entrypoint.sh then drops the JVM to the `flink`
      # user. Docker creates the flink-checkpoints volume mountpoint as root:root 0755, so
      # without the chown the JobManager cannot create per-job checkpoint directories and
      # every submission dies with:
      #   IOException: Failed to create directory for shared state: file:/tmp/flink-checkpoints/<jobid>/shared
      # It worked before the volume existed only because plain /tmp is mode 1777.
      - "chown flink:flink /tmp/flink-checkpoints 2>/dev/null || true; cp /opt/flink/lib/extra/*.jar /opt/flink/lib/ 2>/dev/null || true; /docker-entrypoint.sh jobmanager"
    environment:
      <<: *aws-env
      TZ: UTC
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: ${TASK_SLOTS:-16}
        parallelism.default: 1
        # 8 jobs (7 feature + 1 risk scoring) each hold a slot for their lifetime. The old
        # 8-slot cluster had none left for the batch SELECTs in 07_analytics_and_monitoring.sql,
        # which then queued forever instead of returning.
        jobmanager.memory.process.size: ${JM_PROCESS_SIZE:-4g}
        # Pin the planner's zone. event_ts is a naive TIMESTAMP(3) parsed from the
        # generator's UTC string, but CURRENT_TIMESTAMP/PROCTIME() are TIMESTAMP_LTZ.
        # 06_risk_scoring_inference.sql mixes the two (enrichment_lag_ms, and the
        # loss-streak staleness guard), so a non-UTC zone here skews both.
        table.local-time-zone: UTC
        rest.port: 8081
        rest.address: 0.0.0.0
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        execution.checkpointing.interval: 60s
        # Without an explicit strategy Flink uses NoRestartBackoffTimeStrategy, so a single
        # TaskManager blip fails every job permanently ("Recovery is suppressed by
        # NoRestartBackoffTimeStrategy") and they must be re-submitted by hand. With this,
        # jobs restore from the last checkpoint once a TM is back.
        restart-strategy.type: exponential-delay
        restart-strategy.exponential-delay.initial-backoff: 10s
        restart-strategy.exponential-delay.max-backoff: 2min
    ports:
      - "8081:8081"
    volumes:
      - ./lib:/opt/flink/lib/extra:ro
      - ./flink_sql:/opt/flink_sql:ro
      - *fluss-remote
      # The tiering service's launcher and its program arguments (see scripts/tiering.sh).
      - ./scripts/tiering.sh:/opt/tiering.sh:ro
      - ./scripts/tiering.args:/opt/tiering.args:ro
      # Shared with the taskmanager on purpose. state.checkpoints.dir is a file:// path, so
      # the JM writes _metadata while the TM writes the state files it references. Left as
      # each container's own /tmp, those two halves live on different filesystems and a
      # recovering TaskManager cannot read the state the previous one wrote.
      - flink-checkpoints:/tmp/flink-checkpoints
    networks:
      - flink-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://jobmanager:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  taskmanager:
    image: *flink-image
    hostname: taskmanager
    entrypoint: /bin/sh
    command:
      - -c
      # chown for the same reason as the jobmanager — see the comment there.
      - "chown flink:flink /tmp/flink-checkpoints 2>/dev/null || true; cp /opt/flink/lib/extra/*.jar /opt/flink/lib/ 2>/dev/null || true; /docker-entrypoint.sh taskmanager"
    environment:
      <<: *aws-env
      TZ: UTC
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: ${TASK_SLOTS:-16}
        parallelism.default: 1
        table.local-time-zone: UTC
        # Defaults are sized for a 64 GB host. This leaves ~35 GB for everything else, which is far more
        # than the ~10 GB the rest of the stack needs.
        #
        # Why this is not just "4g was too small on a big box": `state.backend: filesystem`
        # means HashMapStateBackend, so ALL operator state lives on the task heap, and only
        # a fraction of process memory ends up there. At 4g Flink resolved it to:
        #   taskmanager.memory.task.heap.size = 1127428886b   (1.05 GB)
        #   taskmanager.memory.managed.size   = 1438814063b   (1.34 GB, never used)
        # 1 GB of heap for seven windowed/join/MATCH_RECOGNIZE jobs exhausts in about half
        # an hour. The TM then GC-thrashes rather than throwing OutOfMemoryError, stops
        # answering RPC, and the JobManager reports a checkpoint-trigger AskTimeout followed
        # by "Heartbeat of TaskManager ... timed out" — which reads like a dead container
        # but is really heap starvation. Verify the real split after any change with:
        #   docker compose logs taskmanager | grep -i "task.heap.size"
        # Override for a smaller machine (a laptop's Docker VM is often 8-12 GB):
        #   TM_PROCESS_SIZE=5g JM_PROCESS_SIZE=2g TASK_SLOTS=16 TM_FRAMEWORK_OFFHEAP=512m ./start.sh
        # Keep managed.fraction at 0.1 when you scale down — that ratio is what makes the
        # heap usable, independent of total size.
        taskmanager.memory.process.size: ${TM_PROCESS_SIZE:-24g}
        # Default is 0.4, which would park ~9 GB in managed memory that HashMapStateBackend
        # cannot use. Dropping it to 0.1 redirects that to the task heap where state lives.
        # Raise this again if you switch to RocksDB, which does use managed memory.
        taskmanager.memory.managed.fraction: 0.1
        # Batch-mode SELECTs against Fluss (07_analytics_and_monitoring.sql) use the
        # batch shuffle read buffer pool. The 128m default is too small once the streaming
        # jobs are also running, and queries fail with:
        #   OutOfMemoryError: Can't allocate enough direct buffer for batch shuffle read buffer pool
        taskmanager.memory.framework.off-heap.size: ${TM_FRAMEWORK_OFFHEAP:-1g}
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-checkpoints
    depends_on:
      jobmanager:
        condition: service_healthy
    volumes:
      - ./lib:/opt/flink/lib/extra:ro
      - *fluss-remote
      - flink-checkpoints:/tmp/flink-checkpoints
    networks:
      - flink-net
    deploy:
      replicas: 1
    # Without this, a TM that dies for any reason stays dead: the cluster sits at
    # "Registered TMs: 0" and every job loops on NoResourceAvailableException until
    # someone notices. See GUIDE.md "Surviving a TaskManager loss".
    restart: unless-stopped

  # NOTE: this container never runs /docker-entrypoint.sh (it just idles so we can
  # `docker compose exec` into it), so FLINK_PROPERTIES would be ignored. The cluster
  # address is appended to config.yaml directly instead — without it the SQL Client
  # falls back to the image default rest.address 0.0.0.0 and job submission fails with
  # "Connection refused: /0.0.0.0:8081".
  #
  # The checkpointing/restart keys in that block are NOT redundant with the jobmanager's
  # FLINK_PROPERTIES. Checkpointing is baked into the JobGraph by whoever submits it, so
  # setting it only on the JM left every SQL-submitted job with checkpointing disabled —
  # and Flink's default restart strategy with checkpointing off is *no restart*. That is
  # why one TaskManager loss permanently failed all 7 jobs while the tiering job (which
  # start.sh submits from the jobmanager container, so it did inherit checkpointing)
  # merely went to RESTARTING. Symptom to watch for: the JM log shows "Completed
  # checkpoint N" only for the tiering job and never for jobA/B*/C*/D.
  sql-client:
    image: *flink-image
    hostname: sql-client
    environment:
      # No FLINK_PROPERTIES here on purpose — this container never runs
      # /docker-entrypoint.sh, so it would be ignored. table.local-time-zone is
      # appended to config.yaml by the command below instead.
      <<: *aws-env
      TZ: UTC
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cp /opt/flink/lib/extra/*.jar /opt/flink/lib/ 2>/dev/null || true
        grep -q '^execution.checkpointing.interval' /opt/flink/conf/config.yaml || \
          printf '\njobmanager.rpc.address: jobmanager\nrest.address: jobmanager\nrest.port: 8081\ntable.local-time-zone: UTC\ntable.exec.source.idle-timeout: 5 s\nexecution.checkpointing.interval: 60s\nstate.backend: filesystem\nstate.checkpoints.dir: file:///tmp/flink-checkpoints\nrestart-strategy.type: exponential-delay\nrestart-strategy.exponential-delay.initial-backoff: 10s\nrestart-strategy.exponential-delay.max-backoff: 2min\n' \
            >> /opt/flink/conf/config.yaml
        sleep infinity
    depends_on:
      jobmanager:
        condition: service_healthy
    volumes:
      - ./lib:/opt/flink/lib/extra:ro
      - ./flink_sql:/opt/flink_sql:ro
      - *fluss-remote
    networks:
      - flink-net

  # ── Web SQL editor ───────────────────────────────────────────────────────────
  # The SQL Gateway is the same SQL engine the SQL client embeds, exposed as a REST
  # API: sessions, statements, paged results. It has no UI and sends no CORS headers,
  # so the browser talks to sql-editor, which proxies to it.
  #
  # Like sql-client, it bypasses /docker-entrypoint.sh, so its config is appended to
  # config.yaml directly — the same block as sql-client's, for the same reason: the
  # restart strategy, state backend and idle timeout are baked into the JobGraph by
  # whoever submits it (see the sql-client comment above). One line is left out:
  # execution.checkpointing.interval. With checkpointing on, a streaming SELECT only
  # hands rows to the browser after a checkpoint completes (up to 60s of blank table),
  # so the editor wraps each job it offers (Jobs examples, Pipeline Builder Deploy) in
  # SET 'execution.checkpointing.interval' = '60s' ... RESET instead.
  #
  # idle-timeout=0 means sessions never expire. Everything a user creates lives in the
  # session's in-memory catalog, so the 10-minute default would silently drop their
  # tables over a coffee break.

  sql-gateway:
    image: *flink-image
    hostname: sql-gateway
    environment:
      <<: *aws-env
      TZ: UTC
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cp /opt/flink/lib/extra/*.jar /opt/flink/lib/ 2>/dev/null || true
        grep -q '^execution.target' /opt/flink/conf/config.yaml || \
          printf '\njobmanager.rpc.address: jobmanager\nrest.address: jobmanager\nrest.port: 8081\nexecution.target: remote\ntable.local-time-zone: UTC\ntable.exec.source.idle-timeout: 5 s\nstate.backend: filesystem\nstate.checkpoints.dir: file:///tmp/flink-checkpoints\nrestart-strategy.type: exponential-delay\nrestart-strategy.exponential-delay.initial-backoff: 10s\nrestart-strategy.exponential-delay.max-backoff: 2min\n' \
            >> /opt/flink/conf/config.yaml
        exec /opt/flink/bin/sql-gateway.sh start-foreground \
          -Dsql-gateway.endpoint.rest.address=0.0.0.0 \
          -Dsql-gateway.endpoint.rest.port=8083 \
          -Dsql-gateway.session.idle-timeout=0
    ports:
      - "8083:8083"
    depends_on:
      jobmanager:
        condition: service_healthy
    volumes:
      - ./lib:/opt/flink/lib/extra:ro
      - *fluss-remote
    networks:
      - flink-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # A one-page editor plus the Pipeline Builder at /pipeline: the architecture diagram as
  # buttons that create each table, deploy each job and show what runs, read from the
  # gateway and the JobManager (FLINK_URL). The browser keeps one gateway session and
  # reconnects to it after a reload, so the DDL a user ran is still there.
  #
  # PRELOAD_DDL=true runs 01_sources_and_catalogs.sql into each new session first, like
  # `sql-client.sh --init`. Off by default; the editor has a checkbox for it.
  sql-editor:
    image: python:3.11-slim
    hostname: sql-editor
    environment:
      TZ: UTC
      GATEWAY_URL: http://sql-gateway:8083
      FLINK_URL: http://jobmanager:8081
      PRELOAD_DDL: "${PRELOAD_DDL:-false}"
      # 0 in simple mode: the jobs read Kafka directly, and the Pipeline Builder hides the
      # ingest job, the Fluss log tables, the lake, the tiering service and job E.
      LAKEHOUSE: ${LAKEHOUSE:-0}
    depends_on:
      sql-gateway:
        condition: service_healthy
    volumes:
      - ./sql-editor:/app:ro
      - ./flink_sql:/opt/sql:ro
      # The tiering service's JAR and arguments, for the Pipeline Builder's Start button:
      # the editor uploads the JAR to the JobManager and runs it (see app.py).
      - ./lib/tiering:/opt/tiering:ro
      - ./scripts/tiering.args:/opt/tiering.args:ro
    working_dir: /app
    command: >
      bash -c "pip install -r requirements.txt -q && python3 app.py"
    ports:
      - "8084:8084"
    networks:
      - flink-net
    restart: on-failure

  # ── Environment homepage ─────────────────────────────────────────────────────
  # One static page on port 80 with a card per web UI — each link built from the host
  # the page was opened on, with a live reachability dot — plus the architecture and the
  # connection details. Nothing is proxied; every UI keeps its own port.
  homepage:
    image: nginx:1.27-alpine
    hostname: homepage
    volumes:
      - ./homepage:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    networks:
      - flink-net
    restart: unless-stopped

  # ── Redpanda (Kafka-compatible broker) ───────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:v24.3.7
    hostname: redpanda
    command:
      - redpanda
      - start
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --default-log-level=warn
    ports:
      - "19092:19092"
    networks:
      - flink-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redpanda-init:
    image: redpandadata/redpanda:v24.3.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "rpk topic create bets bet_settlements login_events deposits risk_scores --brokers redpanda:9092 --partitions 4 && echo 'Kafka topics created.'"]
    networks:
      - flink-net

  redpanda-console:
    image: redpandadata/console:v2.7.2
    hostname: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8082:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - flink-net

  # ── PostgreSQL (CDC source for player dimensions) ────────────────────────────

  postgres:
    image: postgres:15
    hostname: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin1
      POSTGRES_DB: betting
      TZ: UTC
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=5
      - -c
      - max_wal_senders=5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./pg_betting_ddl.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./pg_betting_sink_ddl.sql:/docker-entrypoint-initdb.d/02_sink.sql:ro
      - ./pg_cdc_setup.sql:/docker-entrypoint-initdb.d/03_cdc.sql:ro
    networks:
      - flink-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d betting"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Data generators (baseline traffic + outliner UI) ─────────────────────────

  baseline-gen:
    image: python:3.11-slim
    environment:
      # Pin UTC: event_time is a naive string from datetime.now(), so the
      # container's zone silently defines what it means. See GUIDE.md.
      TZ: UTC
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./datagen:/app:ro
    working_dir: /app
    command: >
      bash -c "pip install -r requirements.txt -q && python3 baseline_generator.py"
    networks:
      - flink-net
    restart: on-failure

  outliner-gen:
    image: python:3.11-slim
    environment:
      # Pin UTC: event_time is a naive string from datetime.now(), so the
      # container's zone silently defines what it means. See GUIDE.md.
      TZ: UTC
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./datagen:/app:ro
    working_dir: /app
    command: >
      bash -c "pip install -r requirements.txt -q && python3 outliner_generator.py"
    ports:
      - "9050:9050"
    networks:
      - flink-net
    restart: on-failure

  # ── Python inference service ─────────────────────────────────────────────────

  inference:
    build:
      context: inference_service
    hostname: inference
    environment:
      FLUSS_BOOTSTRAP: "coordinator-server:9123"
      KAFKA_BOOTSTRAP: "redpanda:9092"
    ports:
      - "9051:9051"
    depends_on:
      # Must be service_healthy, not service_started: the inference service opens its
      # Fluss connection once at startup with no retry, so if the coordinator is not
      # accepting connections yet it comes up permanently with fluss_ready=false and
      # /score silently returns an empty feature dict.
      coordinator-server:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - flink-net
    restart: on-failure

  # ── Grafana (monitoring) ──────────────────────────────────────────────────────

  grafana:
    image: grafana/grafana:11.3.0
    hostname: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards
    networks:
      - flink-net

networks:
  flink-net:
    driver: bridge

volumes:
  postgres-data:
  flink-checkpoints:
  fluss-remote-data:
  minio-data:
  catalog-db-data:
