# Datagen configuration for the Docker Compose OSS setup.
# Read by baseline_generator.py and outliner_generator.py in this directory, which
# resolve it relative to their working directory (/app in the containers).
# Hostnames are Docker service names on the flink-net network.

[KAFKA]
bootstrap_servers     = redpanda:9092
topic_bets            = bets
topic_settlements     = bet_settlements
topic_logins          = login_events
topic_deposits        = deposits

[POSTGRES]
host     = postgres
port     = 5432
database = betting
user     = root
password = admin1

[GENERATOR]
# Sized for demos, not scale. Every player is seeded into Postgres and then read by
# the CDC snapshot on the first run of the jobA-cdc-dimensions job, so this number
# sets how long that job takes before any dimension data reaches the feature store.
# 50000 made that snapshot slow enough to be awkward live; 5000 tells the same story.
# Raise it if you specifically want to demo snapshot throughput.
num_players       = 1000
min_event_freq_ms = 300
max_event_freq_ms = 600

[OUTLINERS]
archetype_duration_sec = 15
