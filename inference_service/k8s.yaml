apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: vvp-deploy
  labels:
    app: inference-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
    spec:
      containers:
        - name: inference-service
          image: betting-inference:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9051
          env:
            - name: FLUSS_BOOTSTRAP
              value: "coordinator-server-0.coordinator-server-hs.fluss.svc.cluster.local:9124"
            - name: KAFKA_BOOTSTRAP
              value: "host.minikube.internal:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: vvp-deploy
spec:
  selector:
    app: inference-service
  ports:
    - port: 9051
      targetPort: 9051
